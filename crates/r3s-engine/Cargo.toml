description = "Reconciler loop and container lifecycle management for r3s"

[dependencies]
r3s-proto = { path = "../r3s-proto" }
r3s-store = { path = "../r3s-store" }
r3s-runtime = { path = "../r3s-runtime" }

thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "signal", "rt-multi-thread", "macros"] }
futures = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
